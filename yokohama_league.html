<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リーグ戦表 - 横浜市リーグ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #f0f4f8;
  color: #1a2332;
  font-family: 'Inter', 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  padding: 24px 16px;
}

header {
  text-align: center;
  margin-bottom: 32px;
}

.header-label {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #1a6bb5;
  font-weight: 700;
  margin-bottom: 6px;
}

h1 {
  font-size: 26px;
  font-weight: 900;
  color: #0d1b2e;
  letter-spacing: -0.5px;
}

.season-badge {
  display: inline-block;
  margin-top: 8px;
  background: #1a6bb5;
  color: #fff;
  font-size: 11px;
  padding: 3px 14px;
  border-radius: 20px;
  letter-spacing: 1px;
  font-weight: 600;
}

/* Stats bar */
.stats-bar {
  display: flex;
  gap: 0;
  justify-content: center;
  margin-bottom: 28px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(26,107,181,0.08);
  overflow: hidden;
  border: 1px solid #d0e4f7;
}
.stat-item {
  text-align: center;
  flex: 1;
  padding: 14px 8px;
  border-right: 1px solid #e8f0f9;
}
.stat-item:last-child { border-right: none; }
.stat-num {
  font-size: 24px;
  font-weight: 900;
  color: #0d1b2e;
  line-height: 1;
}
.stat-lbl {
  font-size: 9px;
  color: #1a6bb5;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 3px;
  font-weight: 600;
}

/* Section title */
.section-title {
  font-size: 10px;
  letter-spacing: 2px;
  color: #1a6bb5;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.legend {
  font-size: 10px;
  color: #8aa4be;
  text-align: center;
  margin-bottom: 10px;
}

/* Table wrapper */
.table-wrapper {
  overflow-x: auto;
  margin-bottom: 28px;
  border-radius: 10px;
  box-shadow: 0 2px 16px rgba(26,107,181,0.08);
  border: 1px solid #d0e4f7;
}

/* Cross table */
table.cross {
  border-collapse: collapse;
  width: 100%;
  min-width: 480px;
  background: #fff;
  font-size: 12px;
}
table.cross th, table.cross td {
  border: 1px solid #e8f0f9;
  text-align: center;
  padding: 0;
}
table.cross thead th {
  background: #1a6bb5;
  color: #fff;
  font-weight: 700;
  font-size: 10px;
  padding: 9px 4px;
  white-space: nowrap;
}
table.cross thead th:first-child {
  text-align: left;
  padding-left: 12px;
  min-width: 120px;
  background: #1457a0;
}
table.cross td:first-child {
  text-align: left;
  padding: 7px 12px;
  font-size: 11px;
  font-weight: 600;
  color: #1a2332;
  background: #f7fafd;
  white-space: nowrap;
}
table.cross tr.myteam td:first-child {
  color: #1a6bb5;
  background: #e8f3fd;
  font-weight: 800;
}
table.cross thead th.myteam-col {
  background: #0d4a8a;
}
table.cross td.myteam-col {
  background: #f0f7ff;
}
td.diagonal {
  background: #e8f0f9 !important;
  cursor: default;
  color: #b0c4d8;
}
td.result-cell {
  cursor: pointer;
  min-width: 44px;
  height: 36px;
  transition: background 0.15s;
}
td.result-cell:hover { background: #dceeff !important; }
td.mirror {
  background: #f5f9fd !important;
  cursor: pointer;
}
td.mirror:hover { background: #dceeff !important; }
.result-text {
  font-size: 12px;
  font-weight: 700;
  display: block;
}
.result-text.win  { color: #1a7a3c; }
.result-text.draw { color: #c07a00; }
.result-text.lose { color: #c0251a; }
.result-text.empty { color: #c8d8e8; font-weight: 400; font-size: 10px; }

/* Standings */
table.standings {
  border-collapse: collapse;
  width: 100%;
  background: #fff;
  font-size: 13px;
  border-radius: 10px;
  overflow: hidden;
}
table.standings thead tr {
  background: #1a6bb5;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}
table.standings th {
  padding: 10px 12px;
  text-align: center;
}
table.standings th:nth-child(2) { text-align: left; }
table.standings tbody tr { border-top: 1px solid #e8f0f9; transition: background 0.1s; }
table.standings tbody tr:hover { background: #f0f7ff; }
table.standings tbody tr.myteam { background: #e8f3fd; }
table.standings tbody tr.myteam:hover { background: #dceeff; }
table.standings td {
  padding: 10px 12px;
  text-align: center;
  color: #1a2332;
}
table.standings td:nth-child(2) {
  text-align: left;
  font-weight: 600;
}
.rank-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  border-radius: 50%;
  font-size: 11px;
  font-weight: 700;
  background: #d0e4f7;
  color: #1a6bb5;
}
.rank-badge.top1 { background: #f9a825; color: #fff; }
.rank-badge.top2 { background: #78909c; color: #fff; }
.rank-badge.top3 { background: #8d6e63; color: #fff; }
.team-star { color: #1a6bb5; margin-right: 4px; font-size: 10px; }
td.pts { font-weight: 900; font-size: 15px; color: #1a6bb5; }

/* Schedule */
.btn-add-schedule {
  display: block;
  width: 100%;
  padding: 12px;
  background: #fff;
  border: 1px dashed #1a6bb5;
  border-radius: 8px;
  color: #1a6bb5;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 28px;
  transition: background 0.15s;
}
.btn-add-schedule:hover { background: #f0f7ff; }
.schedule-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #fff;
  border: 1px solid #d0e4f7;
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: background 0.15s;
  box-shadow: 0 1px 4px rgba(26,107,181,0.06);
}
.schedule-item:hover { background: #f0f7ff; }
.schedule-item.next { border-color: #1a6bb5; background: #f0f7ff; }
.schedule-date {
  font-size: 13px;
  font-weight: 700;
  color: #0d1b2e;
  min-width: 80px;
}
.schedule-date .day-label {
  font-size: 10px;
  color: #1a6bb5;
  font-weight: 600;
  display: block;
  letter-spacing: 1px;
}
.schedule-opponent {
  font-size: 13px;
  color: #1a2332;
  font-weight: 600;
  flex: 1;
  text-align: center;
}
.schedule-next-badge {
  font-size: 9px;
  background: #1a6bb5;
  color: #fff;
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: 700;
  letter-spacing: 1px;
}
.schedule-empty {
  text-align: center;
  color: #b0c4d8;
  font-size: 13px;
  padding: 20px;
  border: 1px dashed #d0e4f7;
  border-radius: 8px;
  margin-bottom: 8px;
  background: #fff;
}

/* Buttons */
.github-section { margin-bottom: 12px; }
.btn-github {
  display: block;
  width: 100%;
  padding: 14px 28px;
  background: #0d1b2e;
  border: none;
  border-radius: 10px;
  color: #58a6ff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 1px;
  transition: background 0.15s;
}
.btn-github:hover { background: #1a2e48; }
.github-status { font-size: 11px; text-align: center; margin-top: 6px; min-height: 16px; }
.token-area { margin-top: 10px; display: none; }
.token-input {
  width: 100%;
  background: #f0f4f8;
  border: 1px solid #d0e4f7;
  border-radius: 6px;
  color: #0d1b2e;
  font-size: 13px;
  padding: 8px 10px;
  outline: none;
  margin-bottom: 8px;
}
.btn-token-save {
  width: 100%;
  padding: 8px;
  background: #1a6bb5;
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.save-section { margin-bottom: 12px; }
.btn-save-local {
  display: block;
  width: 100%;
  padding: 14px 28px;
  background: #fff;
  border: 1px solid #d0e4f7;
  border-radius: 10px;
  color: #1a6bb5;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 1px;
  transition: background 0.15s;
  box-shadow: 0 1px 4px rgba(26,107,181,0.06);
}
.btn-save-local:hover { background: #f0f7ff; }
.share-section { margin-bottom: 28px; }
.btn-share {
  display: block;
  width: 100%;
  padding: 14px 28px;
  background: #1a6bb5;
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 1px;
  transition: background 0.15s;
}
.btn-share:hover { background: #1457a0; }
.share-link-area {
  margin-top: 12px;
  background: #fff;
  border: 1px solid #d0e4f7;
  border-radius: 8px;
  padding: 12px;
}
.share-link-box {
  font-size: 11px;
  color: #1a6bb5;
  word-break: break-all;
  margin-bottom: 8px;
}
.btn-copy {
  width: 100%;
  padding: 8px;
  background: #f0f7ff;
  border: 1px solid #d0e4f7;
  border-radius: 6px;
  color: #1a6bb5;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(13,27,46,0.6);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff;
  border: 1px solid #d0e4f7;
  border-radius: 14px;
  padding: 24px 28px;
  width: 300px;
  box-shadow: 0 20px 60px rgba(13,27,46,0.2);
}
.modal h2 {
  font-size: 13px;
  color: #1a6bb5;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 4px;
  font-weight: 700;
}
.modal .matchup {
  font-size: 14px;
  font-weight: 700;
  color: #0d1b2e;
  margin-bottom: 20px;
  line-height: 1.5;
}
.modal .matchup span { color: #1a6bb5; }
.score-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}
.score-label { font-size: 11px; color: #1a6bb5; min-width: 60px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score-label.right { text-align: left; }
.score-input {
  width: 58px;
  background: #f0f4f8;
  border: 1px solid #d0e4f7;
  border-radius: 6px;
  color: #0d1b2e;
  font-size: 20px;
  font-weight: 700;
  text-align: center;
  padding: 6px 4px;
  outline: none;
}
.score-input:focus { border-color: #1a6bb5; }
.score-sep { font-size: 18px; color: #1a6bb5; font-weight: 700; }
.modal-btns { display: flex; gap: 10px; }
.btn { flex: 1; padding: 10px; border: none; border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
.btn:hover { opacity: 0.85; }
.btn-save { background: #1a6bb5; color: #fff; }
.btn-clear { background: #f0f4f8; color: #1a6bb5; border: 1px solid #d0e4f7; }
.btn-cancel { background: #f0f4f8; color: #8aa4be; }

/* View mode */
body.view-mode .edit-only { display: none !important; }
body.view-mode td.result-cell { cursor: default; pointer-events: none; }
body.view-mode td.mirror { cursor: default; pointer-events: none; }

<!-- Score Modal -->

      <span class="score-label" id="scoreLabel1"></span>
      <input class="score-input" type="number" min="0" max="99" id="scoreA" placeholder="0">
      <span class="score-sep">－</span>
      <input class="score-input" type="number" min="0" max="99" id="scoreB" placeholder="0">
      <span class="score-label right" id="scoreLabel2"></span>
    </div>
    <div class="modal-btns">
      <button class="btn btn-save" onclick="saveResult()">保存</button>
      <button class="btn btn-clear" onclick="clearResult()">削除</button>
      <button class="btn btn-cancel" onclick="closeModal()">キャンセル</button>
    </div>
  </div>
</div>

<script>
const TEAMS = [
  { id: 0, name: 'FUNPLACE横浜',   short: 'FUN' },
  { id: 1, name: 'バンデリージャ横浜', short: 'BAN' },
  { id: 2, name: 'FC LEGEND',      short: 'LEG' },
  { id: 3, name: 'FC瀬ケ崎',       short: 'SEG' },
  { id: 4, name: 'ヨコハマFC',      short: 'YFC' },
  { id: 5, name: 'FC ESPINA',      short: 'ESP' },
];
const N = TEAMS.length;
const MY_TEAM = 0;
const TOTAL_MATCHES = N * (N - 1) / 2;
const STORAGE_KEY = 'yokohama_league_2026';
const STORAGE_SCHED_KEY = 'yokohama_league_2026_schedule';

let results = {};
let schedules = [];
let editingScheduleIdx = -1;

function key(i, j) { const lo=Math.min(i,j),hi=Math.max(i,j); return lo+'_'+hi; }
function getResult(i,j) { return results[key(i,j)]||null; }
function scoreFor(i,j) { const r=getResult(i,j); if(!r) return null; return i<j?r.a:r.b; }

function load() { try { const s=localStorage.getItem(STORAGE_KEY); if(s) results=JSON.parse(s); } catch(e){} }
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(results)); }
function loadSchedules() { try { const s=localStorage.getItem(STORAGE_SCHED_KEY); if(s) schedules=JSON.parse(s); } catch(e){} }
function saveSchedules() { localStorage.setItem(STORAGE_SCHED_KEY, JSON.stringify(schedules)); }

function manualSave() {
  save(); saveSchedules();
  document.getElementById('saveDone').style.display='block';
  document.getElementById('saveDone').textContent='✅ 保存しました！';
  setTimeout(()=>{ document.getElementById('saveDone').style.display='none'; },2000);
}

// Mode switch
function switchToEditMode() {
  document.body.classList.remove('view-mode');
  document.getElementById('viewModeBanner').style.display='none';
  document.getElementById('editModeBanner').style.display='block';
}
function switchToViewMode() {
  document.body.classList.add('view-mode');
  document.getElementById('editModeBanner').style.display='none';
  document.getElementById('viewModeBanner').style.display='block';
}

// Score Modal
let modalI=-1, modalJ=-1;
function openModal(i,j) {
  modalI=i; modalJ=j;
  document.getElementById('modalMatchup').innerHTML='<span>'+TEAMS[i].name+'</span><br>vs<br><span>'+TEAMS[j].name+'</span>';
  document.getElementById('scoreLabel1').textContent=TEAMS[i].short;
  document.getElementById('scoreLabel2').textContent=TEAMS[j].short;
  const r=getResult(i,j);
  document.getElementById('scoreA').value=r!==null?scoreFor(i,j):'';
  document.getElementById('scoreB').value=r!==null?scoreFor(j,i):'';
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('scoreA').focus();
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function saveResult() {
  const sa=parseInt(document.getElementById('scoreA').value);
  const sb=parseInt(document.getElementById('scoreB').value);
  if(isNaN(sa)||isNaN(sb)||sa<0||sb<0){ alert('スコアを正しく入力してください'); return; }
  const lo=Math.min(modalI,modalJ),hi=Math.max(modalI,modalJ);
  results[key(lo,hi)]={a:(modalI===lo?sa:sb),b:(modalI===lo?sb:sa)};
  save(); render(); closeModal();
}
function clearResult() { delete results[key(modalI,modalJ)]; save(); render(); closeModal(); }

document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('modalOverlay').addEventListener('click',function(e){ if(e.target===this) closeModal(); });
  document.getElementById('scheduleModalOverlay').addEventListener('click',function(e){ if(e.target===this) closeScheduleModal(); });
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); closeScheduleModal(); } });

// Render cross table
function renderCross() {
  const tbl=document.getElementById('crossTable');
  let html='<thead><tr><th>チーム</th>';
  TEAMS.forEach((t,i)=>{ html+='<th class="'+(i===MY_TEAM?'myteam-col':'')+'">'+(i===MY_TEAM?'<span style="color:#fff;font-weight:900">'+t.short+'</span>':t.short)+'</th>'; });
  html+='</tr></thead><tbody>';
  TEAMS.forEach((teamRow,ri)=>{
    html+='<tr class="'+(ri===MY_TEAM?'myteam':'')+'"><td>'+(ri===MY_TEAM?'⭐ ':'')+teamRow.name+'</td>';
    TEAMS.forEach((teamCol,ci)=>{
      if(ri===ci){ html+='<td class="diagonal">－</td>'; return; }
      const r=getResult(ri,ci);
      const colClass=ci===MY_TEAM?'myteam-col':'';
      if(ri>ci){
        let inner,cls='';
        if(r!==null){ const sf=scoreFor(ri,ci),sa=scoreFor(ci,ri); cls=sf>sa?'win':sf===sa?'draw':'lose'; inner='<span class="result-text '+cls+'">'+sf+'–'+sa+'</span>'; }
        else { inner='<span class="result-text empty">－</span>'; }
        html+='<td class="result-cell '+colClass+'" onclick="openModal('+ri+','+ci+')" title="'+teamRow.name+' vs '+teamCol.name+'">'+inner+'</td>';
      } else {
        let inner='';
        if(r!==null){ const sf=scoreFor(ri,ci),sa=scoreFor(ci,ri); const cls=sf>sa?'win':sf===sa?'draw':'lose'; inner='<span class="result-text '+cls+'" style="opacity:0.45;font-size:11px">'+sf+'–'+sa+'</span>'; }
        else { inner='<span class="result-text empty" style="font-size:9px">▪</span>'; }
        html+='<td class="mirror '+colClass+'" onclick="openModal('+ci+','+ri+')" title="'+teamRow.name+' vs '+teamCol.name+'">'+inner+'</td>';
      }
    });
    html+='</tr>';
  });
  html+='</tbody>';
  tbl.innerHTML=html;
}

// Standings
function calcStandings() {
  return TEAMS.map((t,i)=>{
    let w=0,d=0,l=0,gf=0,ga=0;
    for(let j=0;j<N;j++){
      if(i===j) continue;
      const r=getResult(i,j); if(!r) continue;
      const sf=scoreFor(i,j),sa=scoreFor(j,i);
      gf+=sf; ga+=sa;
      if(sf>sa)w++; else if(sf===sa)d++; else l++;
    }
    return {id:i,name:t.name,played:w+d+l,w,d,l,gf,ga,gd:gf-ga,pts:w*3+d};
  }).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name));
}

function renderStandings() {
  const data=calcStandings();
  const tbl=document.getElementById('standingsTable');
  let html='<thead><tr><th>#</th><th>チーム</th><th>試</th><th>勝</th><th>分</th><th>負</th><th>得</th><th>失</th><th>得失</th><th>勝点</th></tr></thead><tbody>';
  data.forEach((t,idx)=>{
    const rank=idx+1;
    const bc=rank===1?'top1':rank===2?'top2':rank===3?'top3':'';
    const isMe=t.id===MY_TEAM;
    html+='<tr class="'+(isMe?'myteam':'')+'"><td><span class="rank-badge '+bc+'">'+rank+'</span></td><td>'+(isMe?'<span class="team-star">⭐</span>':'')+t.name+'</td><td>'+t.played+'</td><td style="color:#1a7a3c;font-weight:600">'+t.w+'</td><td style="color:#c07a00">'+t.d+'</td><td style="color:#c0251a">'+t.l+'</td><td>'+t.gf+'</td><td>'+t.ga+'</td><td style="color:'+(t.gd>0?'#1a7a3c':t.gd<0?'#c0251a':'#8aa4be')+'">'+(t.gd>0?'+':'')+t.gd+'</td><td class="pts">'+t.pts+'</td></tr>';
  });
  html+='</tbody>';
  tbl.innerHTML=html;
}

function renderStats() {
  let w=0,d=0,l=0,gf=0,ga=0;
  for(let j=0;j<N;j++){
    if(j===MY_TEAM) continue;
    const r=getResult(MY_TEAM,j); if(!r) continue;
    const sf=scoreFor(MY_TEAM,j),sa=scoreFor(j,MY_TEAM);
    gf+=sf; ga+=sa;
    if(sf>sa)w++; else if(sf===sa)d++; else l++;
  }
  document.getElementById('stat-played').textContent=w+d+l;
  document.getElementById('stat-w').textContent=w;
  document.getElementById('stat-d').textContent=d;
  document.getElementById('stat-l').textContent=l;
  document.getElementById('stat-gf').textContent=gf;
  document.getElementById('stat-ga').textContent=ga;
  document.getElementById('stat-pts').textContent=w*3+d;
}

// Schedule
const DAYS_JA=['日','月','火','水','木','金','土'];
function formatDate(dateStr) {
  const d=new Date(dateStr+'T00:00:00');
  return {main:(d.getMonth()+1)+'/'+(d.getDate()),sub:'('+DAYS_JA[d.getDay()]+')'}
}
function renderSchedule() {
  const container=document.getElementById('scheduleList');
  if(!container) return;
  if(schedules.length===0){ container.innerHTML='<div class="schedule-empty">試合予定はありません</div>'; return; }
  const today=new Date().toISOString().slice(0,10);
  const sorted=schedules.map((s,i)=>({...s,idx:i})).sort((a,b)=>a.date.localeCompare(b.date));
  const myNextIdx=sorted.findIndex(s=>s.date>=today&&(s.teamA===MY_TEAM||s.teamB===MY_TEAM));
  let html='';
  sorted.forEach((s,si)=>{
    const isMyNext=si===myNextIdx;
    const {main,sub}=formatDate(s.date);
    const nameA=TEAMS[s.teamA]?.name||'';
    const nameB=TEAMS[s.teamB]?.name||'';
    const hlA=s.teamA===MY_TEAM?' style="color:#1a6bb5"':'';
    const hlB=s.teamB===MY_TEAM?' style="color:#1a6bb5"':'';
    const clickable=!document.body.classList.contains('view-mode')?' onclick="openScheduleModal('+s.idx+')"':'';
    html+='<div class="schedule-item'+(isMyNext?' next':'')+'"'+clickable+'><div class="schedule-date">'+main+'<span class="day-label">'+sub+'</span></div><div class="schedule-opponent"><span'+hlA+'>'+nameA+'</span> <span style="color:#1a6bb5;font-size:11px">vs</span> <span'+hlB+'>'+nameB+'</span></div>'+(isMyNext?'<span class="schedule-next-badge">NEXT</span>':'<span style="width:36px"></span>')+'</div>';
  });
  container.innerHTML=html;
}
function populateTeamSelects() {
  const opts=TEAMS.map(t=>'<option value="'+t.id+'">'+t.name+'</option>').join('');
  document.getElementById('schedTeamA').innerHTML=opts;
  document.getElementById('schedTeamB').innerHTML=opts;
}
function openScheduleModal(idx) {
  editingScheduleIdx=idx; populateTeamSelects();
  if(idx>=0&&schedules[idx]){
    document.getElementById('schedModalTitle').textContent='試合予定を編集';
    document.getElementById('schedDate').value=schedules[idx].date;
    document.getElementById('schedTeamA').value=schedules[idx].teamA;
    document.getElementById('schedTeamB').value=schedules[idx].teamB;
    document.getElementById('schedDeleteBtn').style.display='';
  } else {
    document.getElementById('schedModalTitle').textContent='試合予定を追加';
    document.getElementById('schedDate').value='';
    document.getElementById('schedTeamA').value=MY_TEAM;
    document.getElementById('schedTeamB').value=1;
    document.getElementById('schedDeleteBtn').style.display='none';
  }
  document.getElementById('scheduleModalOverlay').classList.add('open');
}
function closeScheduleModal() { document.getElementById('scheduleModalOverlay').classList.remove('open'); }
function saveSchedule() {
  const date=document.getElementById('schedDate').value;
  const teamA=parseInt(document.getElementById('schedTeamA').value);
  const teamB=parseInt(document.getElementById('schedTeamB').value);
  if(!date){ alert('日付を入力してください'); return; }
  if(teamA===teamB){ alert('異なるチームを選んでください'); return; }
  if(editingScheduleIdx>=0) schedules[editingScheduleIdx]={date,teamA,teamB};
  else schedules.push({date,teamA,teamB});
  saveSchedules(); renderSchedule(); closeScheduleModal();
}
function deleteSchedule() {
  if(editingScheduleIdx>=0){ schedules.splice(editingScheduleIdx,1); saveSchedules(); renderSchedule(); }
  closeScheduleModal();
}

// Share
function generateShareLink() {
  const data={r:results,s:schedules};
  const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  const url=location.href.split('?')[0].split('#')[0]+'?d='+encoded;
  document.getElementById('shareLinkBox').textContent=url;
  document.getElementById('shareLinkArea').style.display='block';
  document.getElementById('copyDone').style.display='none';
}
function copyShareLink() {
  const url=document.getElementById('shareLinkBox').textContent;
  navigator.clipboard.writeText(url).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=url;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
  document.getElementById('copyDone').style.display='block';
  setTimeout(()=>{ document.getElementById('copyDone').style.display='none'; },2000);
}
function loadFromURL() {
  const params=new URLSearchParams(location.search);
  const d=params.get('d');
  if(!d) return false;
  try {
    const data=JSON.parse(decodeURIComponent(escape(atob(d))));
    if(data.r) results=data.r;
    if(data.s) schedules=data.s;
    document.body.classList.add('view-mode');
    document.getElementById('viewModeBanner').style.display='block';
    return true;
  } catch(e) { return false; }
}
